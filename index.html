<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050b13;
    color:#ffffff;
    line-height:1.7;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:0 22px;
}


/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(5,11,19,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #17283b;
}

.nav{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand img{
    width:44px;
    height:44px;
    object-fit:contain;
}

.brand-name{
    font-size:17px;
    font-weight:900;
}

.brand-name span{
    color:#42a5ff;
}

.brand-small{
    display:block;
    margin-top:3px;
    color:#60748a;
    font-size:7px;
    letter-spacing:1px;
}

.nav-links{
    display:flex;
    gap:21px;
}

.nav-links a{
    color:#9caec0;
    font-size:9px;
    font-weight:bold;
}

.nav-links a:hover{
    color:#42a5ff;
}

.nav-buttons{
    display:flex;
    gap:8px;
}

.login-btn,
.start-btn{
    padding:11px 15px;
    border-radius:9px;
    font-size:8px;
    font-weight:bold;
}

.login-btn{
    border:1px solid #203349;
    background:#0b1623;
}

.start-btn{
    background:#087cff;
}

.menu-btn{
    display:none;
    border:1px solid #203349;
    background:#0b1623;
    color:#fff;
    border-radius:8px;
    padding:9px 11px;
    cursor:pointer;
    font-size:15px;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    padding:105px 0 85px;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(8,124,255,.18),
            transparent 48%
        );
}

.hero-grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:35px;
    align-items:center;
}

.badge{
    display:inline-block;
    padding:8px 13px;
    border:1px solid rgba(8,124,255,.35);
    border-radius:50px;
    background:rgba(8,124,255,.08);
    color:#42a5ff;
    font-size:8px;
    font-weight:bold;
}

.hero h1{
    margin-top:23px;
    font-size:clamp(38px,6vw,64px);
    line-height:1.04;
    letter-spacing:-2.5px;
}

.hero h1 span{
    color:#42a5ff;
}

.hero-text{
    max-width:650px;
    margin-top:20px;
    color:#8da1b7;
    font-size:11px;
    line-height:1.9;
}

.hero-buttons{
    display:flex;
    gap:10px;
    margin-top:25px;
    flex-wrap:wrap;
}

.primary-btn,
.secondary-btn{
    display:inline-block;
    padding:14px 20px;
    border-radius:10px;
    font-size:8px;
    font-weight:bold;
}

.primary-btn{
    background:#087cff;
}

.secondary-btn{
    background:#0b1623;
    border:1px solid #203349;
}

.hero-card{
    padding:27px;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:20px;
}

.hero-card-title{
    color:#42a5ff;
    font-size:8px;
    font-weight:bold;
    letter-spacing:1px;
}

.hero-card h2{
    margin-top:10px;
    font-size:22px;
    line-height:1.3;
}

.hero-card p{
    margin-top:11px;
    color:#71869c;
    font-size:9px;
    line-height:1.85;
}

.hero-points{
    display:grid;
    gap:9px;
    margin-top:19px;
}

.hero-point{
    padding:12px;
    background:#08121f;
    border:1px solid #17283b;
    border-radius:10px;
}

.hero-point strong{
    display:block;
    font-size:8px;
}

.hero-point span{
    display:block;
    margin-top:3px;
    color:#64798e;
    font-size:7px;
}


/* =====================================================
   STATS
===================================================== */

.stats{
    padding:0 0 25px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    padding:20px;
    text-align:center;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:15px;
}

.stat strong{
    display:block;
    color:#42a5ff;
    font-size:22px;
}

.stat span{
    display:block;
    margin-top:5px;
    color:#71869c;
    font-size:8px;
}


/* =====================================================
   GENERAL SECTIONS
===================================================== */

section{
    padding:75px 0 0;
}

.section-heading{
    max-width:780px;
    margin-bottom:28px;
}

.label{
    color:#42a5ff;
    font-size:8px;
    font-weight:bold;
    letter-spacing:1px;
    text-transform:uppercase;
}

.section-heading h2{
    margin-top:9px;
    font-size:29px;
    letter-spacing:-1px;
}

.section-heading p{
    margin-top:11px;
    color:#8498ad;
    font-size:10px;
    line-height:1.9;
}


/* =====================================================
   ABOUT
===================================================== */

.about-grid{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:14px;
}

.card{
    padding:28px;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:18px;
}

.card h3{
    font-size:15px;
}

.card p{
    margin-top:11px;
    color:#7e92a8;
    font-size:9px;
    line-height:1.9;
}

.info-list{
    display:grid;
    gap:10px;
    margin-top:17px;
}

.info-item{
    padding:13px;
    background:#08121f;
    border:1px solid #17283b;
    border-radius:10px;
}

.info-item strong{
    display:block;
    font-size:9px;
}

.info-item span{
    display:block;
    margin-top:4px;
    color:#687d92;
    font-size:7px;
    line-height:1.7;
}


/* =====================================================
   ECOSYSTEM
===================================================== */

.ecosystem-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.ecosystem-card{
    padding:23px;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:17px;
}

.ecosystem-icon{
    font-size:22px;
}

.ecosystem-card h3{
    margin-top:13px;
    font-size:12px;
}

.ecosystem-card p{
    margin-top:8px;
    color:#71869c;
    font-size:8px;
    line-height:1.8;
}

.status{
    display:inline-block;
    margin-top:14px;
    padding:5px 8px;
    border-radius:20px;
    background:#08121f;
    border:1px solid #17283b;
    color:#64798e;
    font-size:6px;
    font-weight:bold;
    letter-spacing:.7px;
}


/* =====================================================
   ON1COIN
===================================================== */

.coin-section{
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(8,124,255,.05),
            transparent 55%
        );
}

.coin-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.coin-card{
    padding:28px;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:18px;
}

.coin-card h3{
    font-size:16px;
}

.coin-card p{
    margin-top:10px;
    color:#71869c;
    font-size:9px;
    line-height:1.9;
}

.coin-list{
    display:grid;
    gap:8px;
    margin-top:17px;
}

.coin-item{
    padding:11px 13px;
    background:#08121f;
    border:1px solid #17283b;
    border-radius:9px;
    color:#73879b;
    font-size:8px;
    line-height:1.7;
}


/* =====================================================
   PARTICIPATION
===================================================== */

.participation-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.participation-card{
    padding:22px;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:16px;
}

.participation-card .icon{
    font-size:20px;
}

.participation-card h3{
    margin-top:11px;
    font-size:11px;
}

.participation-card p{
    margin-top:7px;
    color:#71869c;
    font-size:8px;
    line-height:1.8;
}


/* =====================================================
   WALLET
===================================================== */

.wallet-preview{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.balance{
    padding:27px;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:18px;
}

.balance-label{
    color:#6f8499;
    font-size:8px;
}

.balance-value{
    margin-top:8px;
    font-size:29px;
    font-weight:900;
}

.balance-value.coin{
    color:#42a5ff;
}

.balance-value.xp{
    color:#ffffff;
}

.balance p{
    margin-top:8px;
    color:#657a8f;
    font-size:8px;
}


/* =====================================================
   ROADMAP
===================================================== */

.roadmap{
    display:grid;
    gap:11px;
}

.roadmap-item{
    display:grid;
    grid-template-columns:105px 1fr;
    gap:18px;
    padding:20px;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:15px;
}

.roadmap-status{
    color:#42a5ff;
    font-size:7px;
    font-weight:bold;
    letter-spacing:1px;
}

.roadmap-item h3{
    font-size:12px;
}

.roadmap-item p{
    margin-top:7px;
    color:#71869c;
    font-size:8px;
    line-height:1.8;
}


/* =====================================================
   ADVERTISEMENT
===================================================== */

.ad-section{
    padding-top:65px;
}

.ad-box{
    min-height:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:#08111d;
    border:1px solid #17283b;
    border-radius:17px;
    overflow:hidden;
}

.ad-label{
    color:#405267;
    font-size:7px;
    letter-spacing:1px;
}


/* =====================================================
   PARTNERSHIP
===================================================== */

.partner-box{
    padding:35px;
    background:
        linear-gradient(
            120deg,
            rgba(8,124,255,.09),
            #0b1623
        );
    border:1px solid #1b2d43;
    border-radius:20px;
}

.partner-box h2{
    font-size:25px;
}

.partner-box p{
    max-width:800px;
    margin-top:10px;
    color:#8296aa;
    font-size:9px;
    line-height:1.9;
}


/* =====================================================
   FAQ
===================================================== */

.faq{
    display:grid;
    gap:10px;
}

.faq-item{
    padding:20px;
    background:#0b1623;
    border:1px solid #1b2d43;
    border-radius:14px;
}

.faq-item h3{
    font-size:10px;
}

.faq-item p{
    margin-top:7px;
    color:#71869c;
    font-size:8px;
    line-height:1.8;
}


/* =====================================================
   FINAL CTA
===================================================== */

.cta{
    padding-bottom:85px;
}

.cta-box{
    padding:50px 25px;
    text-align:center;
    background:
        radial-gradient(
            circle,
            rgba(8,124,255,.13),
            transparent 65%
        ),
        #0b1623;
    border:1px solid #1b2d43;
    border-radius:22px;
}

.cta-box h2{
    font-size:29px;
}

.cta-box p{
    max-width:620px;
    margin:12px auto;
    color:#8296aa;
    font-size:10px;
    line-height:1.8;
}

.cta-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:23px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    padding:38px 0;
    border-top:1px solid #17283b;
    background:#030810;
}

.footer-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr;
    gap:30px;
}

.footer-brand{
    font-size:17px;
    font-weight:900;
}

.footer-brand span{
    color:#42a5ff;
}

.footer-description{
    max-width:300px;
    margin-top:9px;
    color:#52667a;
    font-size:8px;
    line-height:1.7;
}

.footer-column h4{
    font-size:8px;
    margin-bottom:11px;
}

.footer-column a{
    display:block;
    margin-top:8px;
    color:#63778b;
    font-size:7px;
}

.footer-column a:hover{
    color:#42a5ff;
}

.footer-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
    padding-top:17px;
    border-top:1px solid #17283b;
    color:#405267;
    font-size:7px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:950px){

    .nav-links{
        display:none;
    }

    .menu-btn{
        display:block;
    }

    .
