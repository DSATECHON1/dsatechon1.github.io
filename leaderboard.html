<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ON1 Leaderboard</title>

<meta name="theme-color"
      content="#06101d">

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

:root{
    --bg:#050b13;
    --surface:#0c1624;
    --border:#1d3048;

    --blue:#087cff;
    --blue2:#3aa0ff;

    --green:#00df88;
    --gold:#f5c451;

    --text:#ffffff;
    --muted:#8ea2b8;

    --silver:#c7d0db;
    --bronze:#cd8b55;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(8,124,255,.18),
            transparent 42%
        ),
        var(--bg);

    color:var(--text);
}

a{
    color:inherit;
    text-decoration:none;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    width:100%;
    max-width:850px;

    margin:auto;

    padding:15px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:10px 0;

    margin-bottom:18px;
}

.brand{
    display:flex;

    align-items:center;

    gap:9px;
}

.brand img{
    width:38px;
    height:38px;

    object-fit:contain;
}

.brand strong{
    display:block;

    font-size:16px;
}

.brand strong span{
    color:var(--blue2);
}

.brand small{
    display:block;

    margin-top:2px;

    color:var(--muted);

    font-size:8px;

    letter-spacing:.5px;
}

.back-btn{
    border:1px solid var(--border);

    background:var(--surface);

    color:#dce8f5;

    padding:8px 12px;

    border-radius:9px;

    cursor:pointer;

    font-size:10px;
}


/* =====================================================
   INTRO
===================================================== */

.intro{
    text-align:center;

    margin-bottom:15px;
}

.intro h1{
    font-size:25px;

    font-weight:900;
}

.intro p{
    margin-top:6px;

    color:var(--muted);

    font-size:10px;

    line-height:1.5;
}


/* =====================================================
   TABS
===================================================== */

.tabs{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:6px;

    margin-bottom:14px;
}

.tab{
    border:1px solid var(--border);

    background:var(--surface);

    color:var(--muted);

    border-radius:10px;

    padding:9px 5px;

    cursor:pointer;

    font-size:8px;

    font-weight:800;

    line-height:1.25;

    transition:.2s;
}

.tab-icon{
    display:block;

    font-size:15px;

    margin-bottom:3px;
}

.tab.active{
    background:
        linear-gradient(
            135deg,
            rgba(8,124,255,.18),
            rgba(0,223,136,.08)
        );

    border-color:
        rgba(8,124,255,.55);

    color:#ffffff;
}


/* =====================================================
   YOUR POSITION
===================================================== */

.your-position{
    display:none;

    margin-bottom:14px;

    padding:11px 13px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            rgba(8,124,255,.08),
            rgba(0,223,136,.045)
        );

    border:1px solid rgba(8,124,255,.18);
}

.your-position.show{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.position-label{
    color:var(--muted);

    font-size:9px;
}

.position-mode{
    margin-top:3px;

    color:var(--blue2);

    font-size:8px;

    font-weight:700;
}

.position-user{
    margin-top:3px;

    font-size:11px;

    font-weight:800;
}

.position-rank{
    color:var(--gold);

    font-size:17px;

    font-weight:900;

    white-space:nowrap;
}


/* =====================================================
   LEADERBOARD CARD
===================================================== */

.leaderboard-card{
    background:rgba(12,22,36,.94);

    border:1px solid var(--border);

    border-radius:16px;

    overflow:hidden;
}


/* =====================================================
   TABLE HEADER
===================================================== */

.table-head{
    display:grid;

    grid-template-columns:
        55px
        1fr
        110px
        80px;

    gap:8px;

    align-items:center;

    padding:11px 14px;

    background:rgba(7,16,27,.75);

    border-bottom:1px solid var(--border);

    color:var(--muted);

    font-size:8px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:.5px;
}


/* =====================================================
   LEADERBOARD ROW
===================================================== */

.leader-row{
    display:grid;

    grid-template-columns:
        55px
        1fr
        110px
        80px;

    gap:8px;

    align-items:center;

    min-height:60px;

    padding:10px 14px;

    border-bottom:1px solid rgba(29,48,72,.55);
}

.leader-row:last-child{
    border-bottom:none;
}

.rank{
    font-size:13px;

    font-weight:900;

    color:var(--muted);
}

.rank.top-one{
    color:var(--gold);

    font-size:17px;
}

.rank.top-two{
    color:var(--silver);

    font-size:16px;
}

.rank.top-three{
    color:var(--bronze);

    font-size:16px;
}


/* =====================================================
   MEMBER
===================================================== */

.member{
    min-width:0;
}

.member-name{
    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:11px;

    font-weight:800;
}

.member-id{
    margin-top:3px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    color:var(--muted);

    font-size:8px;
}


/* =====================================================
   VALUES
===================================================== */

.member-value{
    color:var(--blue2);

    font-size:10px;

    font-weight:800;

    text-align:right;

    white-space:nowrap;
}

.member-secondary{
    color:var(--green);

    font-size:10px;

    font-weight:800;

    text-align:right;

    white-space:nowrap;
}


/* =====================================================
   CURRENT USER
===================================================== */

.leader-row.current-user{
    background:
        rgba(8,124,255,.065);

    border-left:
        3px solid var(--blue);
}

.current-badge{
    display:inline-block;

    margin-left:5px;

    padding:2px 5px;

    border-radius:5px;

    background:rgba(8,124,255,.14);

    color:var(--blue2);

    font-size:7px;

    vertical-align:middle;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    padding:35px 15px;

    text-align:center;
}

.loading-icon{
    font-size:28px;
}

.loading strong{
    display:block;

    margin-top:9px;

    font-size:12px;
}

.loading p{
    margin-top:5px;

    color:var(--muted);

    font-size:9px;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    display:none;

    padding:30px 15px;

    text-align:center;

    color:var(--muted);

    font-size:10px;

    line-height:1.6;
}

.status.show{
    display:block;
}

.status.error{
    color:#ff8192;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:22px;

    padding-top:14px;

    border-top:
        1px solid rgba(29,48,72,.55);

    text-align:center;

    color:#61748a;

    font-size:8px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .page{
        padding:12px;
    }

    .tabs{
        gap:5px;
    }

    .tab{
        padding:8px 3px;

        font-size:7px;
    }

    .tab-icon{
        font-size:14px;
    }

    .table-head{
        grid-template-columns:
            42px
            1fr
            85px
            65px;

        padding:10px;
    }

    .leader-row{
        grid-template-columns:
            42px
            1fr
            85px
            65px;

        padding:10px;

        min-height:56px;
    }

    .member-value,
    .member-secondary{
        font-size:9px;
    }

    .intro h1{
        font-size:22px;
    }

}


/* =====================================================
   VERY SMALL SCREENS
===================================================== */

@media(max-width:360px){

    .tabs{
        grid-template-columns:
            repeat(2,1fr);
    }

    .tab{
        padding:9px 5px;

        font-size:8px;
    }

    .table-head{
        grid-template-columns:
            35px
            1fr
            65px
            55px;

        font-size:7px;
    }

    .leader-row{
        grid-template-columns:
            35px
            1fr
            65px
            55px;
    }

    .member-name{
        font-size:10px;
    }

    .member-id{
        font-size:7px;
    }

    .member-value,
    .member-secondary{
        font-size:8px;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- =====================================================

<header class="header">

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCmmOlfLVPs3oPCmFLSl8trLKNqWlo9YKs",

    authDomain:
        "dsatechon1-c8b41.firebaseapp.com",

    projectId:
        "dsatechon1-c8b41",

    storageBucket:
        "dsatechon1-c8b41.firebasestorage.app",

    messagingSenderId:
        "5740594058",

    appId:
        "1:5740594058:web:23fbbca5392f12db863e73"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loading =
    document.getElementById(
        "loading"
    );

const status =
    document.getElementById(
        "status"
    );

const leaderboardRows =
    document.getElementById(
        "leaderboardRows"
    );

const yourPosition =
    document.getElementById(
        "yourPosition"
    );

const yourName =
    document.getElementById(
        "yourName"
    );

const yourRank =
    document.getElementById(
        "yourRank"
    );

const yourMode =
    document.getElementById(
        "yourMode"
    );

const valueHeader =
    document.getElementById(
        "valueHeader"
    );

const secondaryHeader =
    document.getElementById(
        "secondaryHeader"
    );

const introText =
    document.getElementById(
        "introText"
    );

const tabs =
    document.querySelectorAll(
        ".tab"
    );


/* =====================================================
   STATE
===================================================== */

let currentUser =
    null;

let allMembers =
    [];

let currentMode =
    "xp";

let dataLoaded =
    false;


/* =====================================================
   NUMBER HELPER
===================================================== */

function getNumber(value){

    const number =
        Number(value);

    return Number.isFinite(number)
        ? number
        : 0;

}


/* =====================================================
   FIRESTORE FIELDS
===================================================== */

function getXP(data){

    return getNumber(
        data.XP
    );

}


function getBalance(data){

    return getNumber(
        data.balance
    );

}


function getStreak(data){

    return getNumber(
        data.streak
    );

}


function getReferralCount(data){

    return getNumber(
        data.referralCount
    );

}


/* =====================================================
   LEVEL
===================================================== */

function calculateLevel(xp){

    return Math.floor(
        getNumber(xp) / 2500
    );

}


/* =====================================================
   MEMBER NAME
===================================================== */

function getMemberName(data){

    return String(
        data.username ||
        data.firstName ||
        data.firstname ||
        data.name ||
        "ON1 Member"
    );

}


/* =====================================================
   ON1 ID
===================================================== */

function getON1Id(data){

    if(
        data.on1Id
    ){

        return String(
            data.on1Id
        )
        .trim()
        .toUpperCase();

    }

    return "ON1 MEMBER";

}


/* =====================================================
   RANK CLASS
===================================================== */

function getRankClass(rank){

    if(rank === 1){
        return "top-one";
    }

    if(rank === 2){
        return "top-two";
    }

    if(rank === 3){
        return "top-three";
    }

    return "";

}


/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(value){

    return getNumber(
        value
    ).toLocaleString();

}


/* =====================================================
   MODE SETTINGS
===================================================== */

function getModeSettings(){

    if(
        currentMode === "balance"
    ){

        return {

            title:
                "ON1COIN",

            intro:
                "Top 20 members by ON1Coin balance.",

            valueHeader:
                "ON1COIN",

            secondaryHeader:
                "LEVEL",

            getValue:
                getBalance,

            formatValue:
                function(value){

                    return formatNumber(
                        value
                    );

                },

            getSecondary:
                function(data){

                    return calculateLevel(
                        getXP(data)
                    );

                },

            formatSecondary:
                function(value){

                    return "Lv " +
                        formatNumber(
                            value
                        );

                }

        };

    }


    if(
        currentMode === "streak"
    ){

        return {

            title:
                "STREAK",

            intro:
                "Top 20 members with the longest active mining streak.",

            valueHeader:
                "STREAK",

            secondaryHeader:
                "XP",

            getValue:
                getStreak,

            formatValue:
                function(value){

                    return "Day " +
                        formatNumber(
                            value
                        );

                },

            getSecondary:
                getXP,

            formatSecondary:
                function(value){

                    return formatNumber(
                        value
                    );

                }

        };

    }


    if(
        currentMode === "referrals"
    ){

        return {

            title:
                "REFERRALS",

            intro:
                "Top 20 members by referral count.",

            valueHeader:
                "REFERRALS",

            secondaryHeader:
                "XP",

            getValue:
                getReferralCount,

            formatValue:
                function(value){

                    return formatNumber(
                        value
                    );

                },

            getSecondary:
                getXP,

            formatSecondary:
                function(value){

                    return formatNumber(
                        value
                    );

                }

        };

    }


    return {

        title:
            "XP",

        intro:
            "Top 20 members by experience points.",

        valueHeader:
            "XP",

        secondaryHeader:
            "LEVEL",

        getValue:
            getXP,

        formatValue:
            function(value){

                return formatNumber(
                    value
                );

            },

        getSecondary:
            function(data){

                return calculateLevel(
                    getXP(data)
                );

            },

        formatSecondary:
            function(value){

                return "Lv " +
                    formatNumber(
                        value
                    );

            }

    };

}


/* =====================================================
   UPDATE HEADERS
===================================================== */

function updateHeaders(){

    const settings =
        getModeSettings();


    valueHeader.textContent =
        settings.valueHeader;


    secondaryHeader.textContent =
        settings.secondaryHeader;


    introText.textContent =
        settings.intro;


    yourMode.textContent =
        settings.title +
        " RANKING";

}


/* =====================================================
   SHOW STATUS
===================================================== */

function showStatus(
    text,
    isError = false
){

    status.textContent =
        text;

    status.className =
        "status show" +
        (
            isError
                ? " error"
                : ""
        );

}


/* =====================================================
   SORT MEMBERS
===================================================== */

function sortMembers(){

    const settings =
        getModeSettings();


    const sorted =
        [...allMembers];


    sorted.sort(
        function(a,b){

            const valueA =
                settings.getValue(
                    a.data
                );

            const valueB =
                settings.getValue(
                    b.data
                );


            if(
                valueB !== valueA
            ){

                return valueB - valueA;

            }


            /*
               If primary values tie,
               higher XP wins.
            */

            const xpA =
                getXP(a.data);

            const xpB =
                getXP(b.data);


            if(
                xpB !== xpA
            ){

                return xpB - xpA;

            }


            /*
               Final deterministic tie-breaker.
            */

            return getON1Id(
                a.data
            )
            .localeCompare(
                getON1Id(
                    b.data
                )
            );

        }
    );


    return sorted;

}


/* =====================================================
   CREATE ROW
===================================================== */

function createRow(
    member,
    rank
){

    const data =
        member.data;


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "leader-row";


    const isCurrentUser =
        currentUser &&
        member.uid ===
        currentUser.uid;


    if(isCurrentUser){

        row.classList.add(
            "current-user"
        );

    }


    const settings =
        getModeSettings();


    const value =
        settings.getValue(
            data
        );


    const secondary =
        settings.getSecondary(
            data
        );


    /* RANK */

    const rankElement =
        document.createElement(
            "div"
        );

    rankElement.className =
        "rank " +
        getRankClass(rank);


    if(rank === 1){

        rankElement.textContent =
            "🥇";

    }else if(rank === 2){

        rankElement.textContent =
            "🥈";

    }else if(rank === 3){

        rankElement.textContent =
            "🥉";

    }else{

        rankElement.textContent =
            "#" + rank;

    }


    /* MEMBER */

    const memberElement =
        document.createElement(
            "div"
        );

    memberElement.className =
        "member";


    const nameElement =
        document.createElement(
            "div"
        );

    nameElement.className =
        "member-name";

    nameElement.textContent =
        getMemberName(
            data
        );


    if(isCurrentUser){

        const badge =
            document.createElement(
                "span"
            );

        badge.className =
            "current-badge";

        badge.textContent =
            "YOU";

        nameElement.appendChild(
            badge
        );

    }


    const idElement =
        document.createElement(
            "div"
        );

    idElement.className =
        "member-id";

    idElement.textContent =
        getON1Id(
            data
        );


    memberElement.appendChild(
        nameElement
    );

    memberElement.appendChild(
        idElement
    );


    /* PRIMARY VALUE */

    const valueElement =
        document.createElement(
            "div"
        );

    valueElement.className =
        "member-value";

    valueElement.textContent =
        settings.formatValue(
            value
        );


    /* SECONDARY VALUE */

    const secondaryElement =
        document.createElement(
            "div"
        );

    secondaryElement.className =
        "member-secondary";

    secondaryElement.textContent =
        settings.formatSecondary(
            secondary
        );


    row.appendChild(
        rankElement
    );

    row.appendChild(
        memberElement
    );

    row.appendChild(
        valueElement
    );

    row.appendChild(
        secondaryElement
    );


    return row;

}


/* =====================================================
   DISPLAY LEADERBOARD
===================================================== */

function displayLeaderboard(){

    updateHeaders();


    leaderboardRows.innerHTML =
        "";

    status.className =
        "status";


    if(
        !allMembers.length
    ){

        showStatus(
            "The leaderboard is currently empty."
        );

        yourPosition.classList.remove(
            "show"
        );

        return;

    }


    const sortedMembers =
        sortMembers();


    /*
       ONLY TOP 20 ARE DISPLAYED.
    */

    const topTwenty =
        sortedMembers.slice(
            0,
            20
        );


    topTwenty.forEach(
        function(member,index){

            leaderboardRows.appendChild(
                createRow(
                    member,
                    index + 1
                )
            );

        }
    );


    /*
       Calculate the logged-in
       member's complete rank.
    */

    if(currentUser){

        const currentIndex =
            sortedMembers.findIndex(
                function(member){

                    return (
                        member.uid ===
                        currentUser.uid
                    );

                }
            );


        if(
            currentIndex !== -1
        ){

            const member =
                sortedMembers[
                    currentIndex
                ];


            yourName.textContent =
                getMemberName(
                    member.data
                );


            yourRank.textContent =
                "#" +
                (
                    currentIndex + 1
                );


            yourPosition.classList.add(
                "show"
            );

        }else{

            yourPosition.classList.remove(
                "show"
            );

        }

    }else{

        yourPosition.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   LOAD MEMBERS
===================================================== */

async function loadLeaderboard(){

    if(dataLoaded){

        displayLeaderboard();

        return;

    }


    loading.style.display =
        "block";

    status.className =
        "status";

    leaderboardRows.innerHTML =
        "";


    try{

        /*
           READ ONLY.

           No balances,
           XP,
           streaks,
           referrals,
           or transactions
           are modified here.
        */

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "users"
                )
            );


        allMembers =
            [];


        snapshot.forEach(
            function(docSnapshot){

                const data =
                    docSnapshot.data();


                allMembers.push({

                    uid:
                        docSnapshot.id,

                    data:
                        data

                });

            }
        );


        dataLoaded =
            true;


        loading.style.display =
            "none";


        displayLeaderboard();


    }catch(error){

        console.error(
            "Leaderboard error:",
            error
        );


        loading.style.display =
            "none";


        showStatus(
            "Unable to load the leaderboard right now. Please try again.",
            true
        );

    }

}


/* =====================================================
   TAB EVENTS
===================================================== */

tabs.forEach(
    function(tab){

        tab.addEventListener(
            "click",
            function(){

                const mode =
                    tab.dataset.mode;


                if(
                    !mode
                ){

                    return;

                }


                currentMode =
                    mode;


                tabs.forEach(
                    function(item){

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                tab.classList.add(
                    "active"
                );


                /*
                   Re-rank existing data.

                   No additional Firebase
                   read is needed.
                */

                displayLeaderboard();

            }
        );

    }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        currentUser =
            user || null;


        loadLeaderboard();

    }
);


</script>
